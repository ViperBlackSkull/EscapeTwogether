services:
  app:
    build: .
    image: escapetwogether:latest
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_NARRATIVE_ENABLED=${AI_NARRATIVE_ENABLED:-true}
      - AI_HINTS_ENABLED=${AI_HINTS_ENABLED:-true}
      - AI_IMAGES_ENABLED=${AI_IMAGES_ENABLED:-true}
      - AI_RATE_LIMIT_RPM=${AI_RATE_LIMIT_RPM:-10}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.z.ai/api/anthropic}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - COMFYUI_URL=${COMFYUI_URL:-}
    env_file:
      - .env
    volumes:
      - escapetwogether-assets:/app/assets
      - escapetwogether-sessions:/app/sessions
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl-certs:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - public

  # Optional: certbot for Let's Encrypt SSL
  # Uncomment to enable HTTPS
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ssl-certs:/etc/letsencrypt
  #     - ./certbot-webroot:/var/www/certbot:ro
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  escapetwogether-assets:
  escapetwogether-sessions:
  ssl-certs:

networks:
  internal:
    internal: true
  public:
